<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CyberPet — 浏览器预览（阶段二 Demo）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #2a2620; }
    body { display: flex; align-items: center; justify-content: center; }
    #frame {
      position: relative;
      width: 100vw; height: 100vh;
      max-width: 480px; max-height: 900px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }
    canvas { display: block; width: 100%; height: 100%; }
    #toast {
      position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%);
      background: rgba(40,34,26,.9); color: #fff; padding: 10px 20px;
      border-radius: 20px; font: 14px sans-serif; opacity: 0;
      transition: opacity .2s; pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="frame"><canvas id="game"></canvas></div>
  <div id="toast"></div>
  <script>
    // 浏览器 Toast 适配
    var toastEl = document.getElementById('toast');
    window.__browserToast = function (msg) {
      toastEl.textContent = msg; toastEl.style.opacity = '1';
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function () { toastEl.style.opacity = '0'; }, 1400);
    };
  </script>
  <!-- 小游戏源码直接以普通 script 加载，各模块挂到 globalThis -->
  <script src="./src/config.js"></script>
  <script src="./src/platform.js"></script>
  <script src="./src/store.js"></script>
  <script src="./src/render.js"></script>
  <script src="./src/input.js"></script>
  <script src="./src/main.js"></script>
  <script>
    MAIN.start();
  </script>
</body>
</html>
